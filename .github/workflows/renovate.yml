# Renovate dependency automation workflow
# Runs Renovate on a schedule or manually to open/update dependency update PRs.
# See renovate.json in the repository root for Renovate configuration.

name: Renovate

on:
  # Run once per day (at 00:00 UTC) to check for dependency updates
  schedule:
    - cron: '0 0 * * *'
  # Allow triggering the workflow manually from the Actions tab
  workflow_dispatch:

jobs:
  renovate:
    name: Run Renovate
    runs-on: ubuntu-latest

    steps:
      # Check out the repository so Renovate can read renovate.json and package files
      - name: Checkout repository
        uses: actions/checkout@v4

      # Run Renovate: it will use the repo config (renovate.json), create/update
      # branches and open or update pull requests for dependency updates.
      - name: Run Renovate
        uses: renovatebot/github-action@v46.1.4
        with:
          # Use the Renovate config from the repository root
          configurationFile: renovate.json
          # Authenticate with GitHub; has permission to create branches and PRs in this repo.
          # For PRs to trigger CI (e.g. push/PR events), use a PAT in a secret like RENOVATE_TOKEN instead.
          token: ${{ secrets.GITHUB_TOKEN }}
